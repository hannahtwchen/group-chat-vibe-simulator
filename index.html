<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Group Chat Vibe Simulator</title><style>
*{box-sizing:border-box}body{margin:0;background:#e9eaf5;color:#252640;font:16px system-ui;transition:background .6s}body.awkward{background:#37374f;color:white}main{max-width:1000px;margin:auto;padding:32px 20px}h1{font-size:clamp(2rem,5vw,3.5rem);margin:0}p{line-height:1.5}.layout{display:grid;grid-template-columns:300px 1fr;gap:20px}.settings,.chat{background:#fff;color:#252640;border-radius:20px;padding:22px;box-shadow:0 8px 30px #20204015}.settings label{display:block;font-weight:650;margin:18px 0 8px}select,input,button{font:inherit}select,input[type=text]{width:100%;padding:12px;border:1px solid #c5c8dc;border-radius:10px}button{border:0;border-radius:10px;padding:12px 16px;background:#6155b8;color:white;cursor:pointer}.emoji{display:flex;gap:6px;flex-wrap:wrap}.emoji button{background:#f0eefb;color:#252640;font-size:1.3rem;padding:8px}.chat{display:flex;flex-direction:column;min-height:540px}.chat header{border-bottom:1px solid #e5e5ef;padding-bottom:12px}.chat header small{display:block;color:#666b84}.messages{flex:1;overflow:auto;max-height:430px;padding:20px 0}.bubble{max-width:85%;width:fit-content;background:#f0eff8;border-radius:15px;padding:10px 14px;margin:9px 0;overflow-wrap:anywhere}.bubble.mine{margin-left:auto;background:#6255b8;color:white}.bubble small{display:block;font-weight:bold;opacity:.75}.status{min-height:24px;color:#696a80;font-size:.9rem}.compose{display:flex;gap:8px}.compose input{flex:1;min-width:0}.tip{font-size:.9rem;color:#666b84}@media(max-width:700px){.layout{grid-template-columns:1fr}.chat{min-height:440px}}
</style></head><body><main><h1>Group Chat Vibe Simulator</h1><p>A tiny social experiment about wording, timing, and the suspense of being left on read.</p><div class="layout"><section class="settings"><h2>Set the scene</h2><label for="time">Time of day</label><select id="time"><option value="day">Daytime</option><option value="evening">Evening</option><option value="night">Late night</option></select><label>Add emojis to your message</label><div class="emoji"><button type="button" data-emoji="🍕" aria-label="Add pizza">🍕</button><button type="button" data-emoji="😂" aria-label="Add laughing">😂</button><button type="button" data-emoji="✨" aria-label="Add sparkles">✨</button><button type="button" data-emoji="❤️" aria-label="Add heart">❤️</button></div><label><input id="receipts" type="checkbox" checked> Read receipts on</label><p class="tip">Try an evening food invitation, a serious message at night, or a meme after an awkward moment.</p><button type="button" id="reset">Start a new chat</button></section><section class="chat"><header><strong>The Usuals ✨</strong><small>Alex, Sam, Jo, and you</small></header><div class="messages" id="messages" aria-live="polite"><div class="bubble"><small>Alex</small>What’s everyone up to?</div></div><div class="status" id="status" role="status"></div><form class="compose" id="form"><input id="message" type="text" maxlength="240" placeholder="Write a message..." aria-label="Your message" required><button type="submit">Send</button></form></section></div></main><script>
const form=document.querySelector('#form'), input=document.querySelector('#message'), messages=document.querySelector('#messages'), status=document.querySelector('#status'), time=document.querySelector('#time'), receipts=document.querySelector('#receipts');
let mood='neutral', pending=[], fallbackIndex=0;
function cancelPending(){pending.forEach(clearTimeout);pending=[];status.textContent='';}
function later(fn,delay){pending.push(setTimeout(fn,delay));}
function bubble(name,text,mine=false){const b=document.createElement('div');b.className='bubble'+(mine?' mine':'');const label=document.createElement('small');label.textContent=name;b.append(label,document.createTextNode(text));messages.append(b);messages.scrollTop=messages.scrollHeight;}
function respond(lines){status.textContent='Someone is typing...';lines.forEach((line,i)=>later(()=>{bubble(line[0],line[1]);status.textContent=i===lines.length-1?'':'Someone is typing...';},800+i*700));}
document.querySelectorAll('[data-emoji]').forEach(button=>button.addEventListener('click',()=>{input.value+=button.dataset.emoji;input.focus();}));
form.addEventListener('submit',event=>{event.preventDefault();const text=input.value.trim();if(!text)return;cancelPending();bubble('You',text,true);input.value='';const lower=text.toLowerCase();const emojiCount=(text.match(/\p{Extended_Pictographic}/gu)||[]).length;
if(lower.includes('we need to talk')){mood='awkward';document.body.classList.add('awkward');if(time.value==='night'&&receipts.checked){status.textContent='Seen by everyone';later(()=>status.textContent='Someone is typing...',1200);later(()=>status.textContent='Seen by everyone',2400);}else{respond([['Sam','Oh. Is everything okay?']]);}}
else if(mood==='awkward'&&(/meme|food|never mind|nevermind/.test(lower))){mood='neutral';document.body.classList.remove('awkward');respond([['Jo','Okay, I can breathe again.'],['Alex','A fresh start sounds good.']]);}
else if(time.value==='evening'&&/food|pizza|eat/.test(lower)&&text.includes('🍕')){mood='excited';document.body.classList.remove('awkward');respond([['Alex','Pizza?! I’m in!'],['Sam','Let’s make it a spontaneous hangout!'],['Jo','On my way 🍕']]);}
else if(emojiCount>=3){mood='excited';document.body.classList.remove('awkward');respond([['Sam','THE ENERGY!!! ✨✨✨'],['Jo','I HAVE NEVER BEEN MORE READY 😂🎉']]);}
else if(mood==='awkward'){respond([['Sam','...so, are we okay?']]);}
else if(/\b(hi|hey|hello|yo|sup)\b/.test(lower)){respond([['Jo','Hey! How’s your day going?'],['Alex','Hi!! 👋']]);}
else if(/\b(food|pizza|eat|dinner|lunch|hungry|breakfast)\b/.test(lower)){respond([['Sam','I could eat! What are you thinking?'],['Jo','Count me in if there are snacks.']]);}
else if(/\b(meme|funny|lol|haha|joke)\b/.test(lower)){respond([['Jo','😂 Okay, that got me.'],['Alex','Sending this to everyone immediately.']]);}
else if(/\b(sad|upset|stressed|tired|worried|rough)\b/.test(lower)){respond([['Sam','I’m sorry it’s been a rough time. Want to talk?'],['Jo','We’re here for you ❤️']]);}
else if(/\b(happy|great|excited|amazing|yay|good news)\b/.test(lower)){respond([['Alex','Yay! I love this for you ✨'],['Sam','We have to celebrate!']]);}
else if(/\b(hang out|hangout|meet|plans|free|movie)\b/.test(lower)){respond([['Jo','I’m interested! When were you thinking?'],['Sam','Let’s make a plan.']]);}
else if(text.includes('?')){respond([['Sam','Good question. What do you all think?'],['Alex','Let me think about that!']]);}
else{const replies=[['Alex','Oh, interesting! What happened next?'],['Jo','I’m listening 👀'],['Sam','That sounds like a story!'],['Alex','I see what you mean.']];respond([replies[fallbackIndex % replies.length]]);fallbackIndex++;}});
document.querySelector('#reset').addEventListener('click',()=>{cancelPending();mood='neutral';fallbackIndex=0;document.body.classList.remove('awkward');messages.replaceChildren();bubble('Alex','What’s everyone up to?');input.value='';time.value='day';receipts.checked=true;});
</script></body></html>
